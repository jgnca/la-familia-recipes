<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="La Familia">
<meta name="theme-color" content="#f3f4ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151812" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%235b6b1e'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='%23fbfcf8' font-family='Georgia,serif' font-weight='700'%3ELF%3C/text%3E%3C/svg%3E">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>La Familia Recipe Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Literata:opsz,wght@7..72,400;7..72,600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: a kitchen index card file. A list of cards, each opening to a full recipe sheet with a servings dial. */
:root{
  --bg:#f3f4ee; --paper:#fbfcf8; --ink:#1f2419; --muted:#626a57; --line:#d8dccd;
  --accent:#5b6b1e; --accent-ink:#fbfcf8; --chip:#e7eadb; --hi:#d9a21b;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Literata",Georgia,"Times New Roman",serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#151812; --paper:#1c2018; --ink:#e7ead9; --muted:#9aa18b; --line:#30362a;
  --accent:#b5c86a; --accent-ink:#151812; --chip:#262b20; --hi:#e3b440; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151812; --paper:#1c2018; --ink:#e7ead9; --muted:#9aa18b; --line:#30362a;
  --accent:#b5c86a; --accent-ink:#151812; --chip:#262b20; --hi:#e3b440; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.1}
header.top{display:flex;flex-direction:column;gap:6px}
header.top h1{font-size:clamp(30px,7vw,44px);font-weight:700;letter-spacing:-.01em}
header.top p{margin:0;color:var(--muted)}
.count{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
input[type=search]{width:100%;box-sizing:border-box;font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink)}
input[type=search]:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{font-family:var(--mono);font-size:12px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--chip);color:var(--ink);cursor:pointer}
.tag[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.list{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.card{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:inherit;text-decoration:none}
.card:hover{border-color:var(--accent)}
.card h2{font-size:20px;font-weight:700;min-width:0}
.card p{grid-column:1/-1;margin:0;color:var(--muted);font-size:15px}
.src{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap;align-self:start;padding-top:5px}
.empty{padding:28px 18px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);text-align:left}
.empty strong{color:var(--ink);font-family:var(--display);font-size:18px;display:block;margin-bottom:4px}
.back{align-self:flex-start;font-family:var(--mono);font-size:13px;color:var(--accent);text-decoration:none}
.sheet{display:flex;flex-direction:column;gap:22px}
.sheet h1{font-size:clamp(28px,6.5vw,40px);font-weight:700}
.meta{display:flex;flex-wrap:wrap;gap:8px 14px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.meta a{color:var(--accent)}
.lede{margin:0;max-width:62ch}
.dial{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:var(--chip);flex-wrap:wrap}
.dial span.l{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.dial button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-size:20px;line-height:1;cursor:pointer}
.dial output{font-family:var(--display);font-weight:700;font-size:22px;min-width:2ch;text-align:center;font-variant-numeric:tabular-nums}
.dial .reset{width:auto;height:auto;padding:6px 10px;border-radius:8px;font-family:var(--mono);font-size:12px}
section h2{font-size:14px;font-family:var(--mono);font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.ing{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.ing li{display:grid;grid-template-columns:26px 92px 1fr;gap:10px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line)}
.ing input{width:18px;height:18px;accent-color:var(--accent);margin:0;transform:translateY(3px)}
.ing .q{font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums;color:var(--accent)}
.ing .n{min-width:0}
.ing li.done .n,.ing li.done .q{text-decoration:line-through;color:var(--muted)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:16px;counter-reset:s}
.steps li{display:grid;grid-template-columns:32px 1fr;gap:12px;counter-increment:s}
.steps li::before{content:counter(s);font-family:var(--display);font-weight:700;font-size:20px;color:var(--hi);line-height:1.3}
.steps h3{font-size:17px;margin-bottom:2px}
.steps p{margin:0}
.time{font-family:var(--mono);font-size:12px;color:var(--muted)}
.notes{padding:14px 16px;border-left:3px solid var(--hi);background:var(--paper);border-radius:0 10px 10px 0}
.notes p{margin:0 0 8px}.notes p:last-child{margin:0}
.startcook{align-self:flex-start;font:600 16px var(--display);padding:12px 20px;border-radius:999px;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer}
#cook{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;
  padding-top:max(16px,env(safe-area-inset-top,0px));padding-bottom:max(16px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
.ck-inner{max-width:760px;width:100%;margin:0 auto;flex:1;display:flex;flex-direction:column;gap:18px;min-height:0}
.ck-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.ck-top .count{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ck-x{font:500 13px var(--mono);padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
.ck-bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.ck-bar i{display:block;height:100%;background:var(--accent)}
.ck-body{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:14px;min-height:0}
.ck-num{font:700 15px var(--mono);color:var(--hi);letter-spacing:.08em;text-transform:uppercase}
.ck-body h2{font-size:clamp(26px,6vw,36px);font-weight:700}
.ck-body p{margin:0;font-size:clamp(19px,4.6vw,23px);line-height:1.5;max-width:40ch}
.ck-timer{align-self:flex-start;font:600 16px var(--mono);padding:12px 18px;border-radius:12px;border:2px solid var(--hi);background:transparent;color:var(--ink);cursor:pointer}
.ck-nav{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ck-nav button{font:600 17px var(--display);padding:15px;border-radius:12px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
.ck-nav button.next{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.ck-nav button:disabled{opacity:.4;cursor:default}
.tray{display:flex;flex-wrap:wrap;gap:8px}
.tm{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 12px;border-radius:10px;background:var(--chip);font-family:var(--mono);font-size:13px}
.tm b{font:700 17px var(--mono);font-variant-numeric:tabular-nums}
.tm.done{background:var(--hi);color:#1f2419}
.tm button{font:500 12px var(--mono);padding:5px 8px;border-radius:6px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
@media (prefers-reduced-motion:no-preference){.tm.done{animation:pulse 1s ease-in-out infinite}@keyframes pulse{50%{opacity:.6}}}
@media (max-width:420px){.ing li{grid-template-columns:24px 76px 1fr}}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}}
</style>

</head>
<body>
<div class="wrap" id="app">
  <header class="top">
    <span class="count" id="count">Recipe book</span>
    <h1>La Familia Recipe Book</h1>
    <p>Recipes from the web, family, and friends.</p>
  </header>
  <div id="view"><div class="empty"><strong>Loading recipes…</strong>One moment.</div></div>
</div>

<script>
(function(){
  const view = document.getElementById('view');
  const countEl = document.getElementById('count');
  let recipes = [], query = '', activeTag = null, scale = {}, checked = {};
  try { activeTag = localStorage.getItem('tag') || null; } catch(e){}

  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const SRC = {instagram:'Instagram', tiktok:'TikTok', web:'Website', question:'Asked Claude', other:'Recipe'};

  function frac(x){
    if (x == null || isNaN(x)) return '';
    const whole = Math.floor(x + 1e-9), r = x - whole;
    const opts = [[0,''],[1/8,'⅛'],[1/4,'¼'],[1/3,'⅓'],[3/8,'⅜'],[1/2,'½'],[5/8,'⅝'],[2/3,'⅔'],[3/4,'¾'],[7/8,'⅞'],[1,'']];
    let best = opts[0];
    for (const o of opts) if (Math.abs(o[0]-r) < Math.abs(best[0]-r)) best = o;
    let w = whole + (best[0] === 1 ? 1 : 0);
    if (Math.abs(best[0]-r) > 0.04 && x < 10) return (Math.round(x*100)/100).toString();
    return (w ? w : '') + best[1] || '0';
  }
  const UNIT = {cup:['cup','cups'],tbsp:['tbsp','tbsp'],tsp:['tsp','tsp'],oz:['oz','oz'],lb:['lb','lb'],g:['g','g'],kg:['kg','kg'],ml:['ml','ml'],l:['l','l'],fl_oz:['fl oz','fl oz'],pinch:['pinch','pinches']};
  function qty(ing, f){
    if (ing.amount == null) return ing.qtyText || '';
    const a = ing.amount * f, u = ing.unit ? (UNIT[ing.unit] || [ing.unit, ing.unit])[a > 1 ? 1 : 0] : '';
    return (frac(a) + (u ? ' ' + u : '')).trim();
  }

  function sorted(){ return recipes.slice().sort((a,b)=> String(b.addedAt||'').localeCompare(String(a.addedAt||''))); }

  function renderList(){
    const all = sorted();
    const tags = [...new Set(all.flatMap(r => r.tags || []))].sort();
    if (activeTag && !tags.includes(activeTag)) activeTag = null;
    const q = query.trim().toLowerCase();
    const shown = all.filter(r => (!activeTag || (r.tags||[]).includes(activeTag)) &&
      (!q || [r.title, r.description, ...(r.tags||[]), ...(r.ingredients||[]).map(i=>i.name)].join(' ').toLowerCase().includes(q)));
    countEl.textContent = all.length === 1 ? '1 recipe' : all.length + ' recipes';
    if (!all.length){
      view.innerHTML = '<div class="empty"><strong>No recipes yet</strong>Send Claude a screenshot, a link or a cooking question in this project and it will add the recipe here.</div>';
      return;
    }
    view.innerHTML = `
      <div style="display:flex;flex-direction:column;gap:14px">
        <label for="q" class="count">Search</label>
        <input type="search" id="q" placeholder="Search by name or ingredient" value="${esc(query)}">
        ${tags.length ? `<div class="tags" role="group" aria-label="Filter by tag">${tags.map(t=>`<button type="button" class="tag" data-tag="${esc(t)}" aria-pressed="${t===activeTag}">${esc(t)}</button>`).join('')}</div>` : ''}
        <ul class="list">${shown.map(r=>`
          <li><a class="card" href="#r-${esc(r.id)}">
            <h2>${esc(r.title)}</h2><span class="src">${esc(SRC[r.source?.type] || 'Recipe')}</span>
            ${r.description ? `<p>${esc(r.description)}</p>` : ''}
          </a></li>`).join('')}</ul>
        ${shown.length ? '' : '<div class="empty"><strong>No matches</strong>Try a different word or clear the tag filter.</div>'}
      </div>`;
    const qi = document.getElementById('q');
    qi.addEventListener('input', e => { query = e.target.value; const pos = e.target.selectionStart; renderList(); const n = document.getElementById('q'); n.focus(); n.setSelectionRange(pos,pos); });
    view.querySelectorAll('.tag').forEach(b => b.addEventListener('click', () => {
      activeTag = activeTag === b.dataset.tag ? null : b.dataset.tag;
      try { activeTag ? localStorage.setItem('tag', activeTag) : localStorage.removeItem('tag'); } catch(e){}
      renderList();
    }));
  }

  function renderRecipe(r){
    const base = r.servings || 1, cur = scale[r.id] || base, f = cur / base;
    const ck = checked[r.id] || (checked[r.id] = {});
    const fill = t => esc(t).replace(/\{(\d+)\}/g, (m, i) => { const ing = (r.ingredients||[])[+i]; return ing ? `<strong>${esc(qty(ing,f))} ${esc(ing.name)}</strong>` : m; });
    const src = r.source || {};
    countEl.textContent = SRC[src.type] || 'Recipe';
    view.innerHTML = `
      <article class="sheet">
        <a class="back" href="#">← All recipes</a>
        <div style="display:flex;flex-direction:column;gap:10px">
          <h1>${esc(r.title)}</h1>
          <div class="meta">
            ${src.label ? `<span>From ${src.url ? `<a href="${esc(src.url)}" target="_blank" rel="noopener">${esc(src.label)}</a>` : esc(src.label)}</span>` : ''}
            ${r.time ? `<span>${esc(r.time)}</span>` : ''}
            ${(r.tags||[]).length ? `<span>${r.tags.map(esc).join(' · ')}</span>` : ''}
          </div>
          ${r.description ? `<p class="lede">${esc(r.description)}</p>` : ''}
        </div>
        <div class="dial" role="group" aria-label="Servings">
          <span class="l">Makes</span>
          <button type="button" id="dec" aria-label="Fewer">−</button>
          <output id="sv" aria-live="polite">${cur}</output>
          <button type="button" id="inc" aria-label="More">+</button>
          <span>${esc(r.servingsLabel || 'servings')}</span>
          ${cur !== base ? '<button type="button" class="reset" id="rs">Reset</button>' : ''}
        </div>
        <section><h2>Ingredients</h2>
          <ul class="ing">${(r.ingredients||[]).map((ing,i)=>`
            <li class="${ck[i]?'done':''}"><input type="checkbox" id="c${i}" data-i="${i}" ${ck[i]?'checked':''} aria-label="Got ${esc(ing.name)}">
            <span class="q">${esc(qty(ing,f))}</span><label class="n" for="c${i}">${esc(ing.name)}</label></li>`).join('')}</ul>
        </section>
        <button type="button" class="startcook" id="go">Start cooking</button>
        <section><h2>Steps</h2>
          <ol class="steps">${(r.steps||[]).map(s=>`
            <li><div><h3>${esc(s.title||'')}</h3><p>${fill(s.text)}</p>${s.minutes ? `<span class="time">${esc(s.minutes)} min</span>` : ''}</div></li>`).join('')}</ol>
        </section>
        ${r.notes ? `<section><h2>Notes</h2><div class="notes">${String(r.notes).split(/\n+/).map(p=>`<p>${esc(p)}</p>`).join('')}</div></section>` : ''}
      </article>`;
    const set = v => { scale[r.id] = Math.max(1, v); renderRecipe(r); };
    document.getElementById('dec').onclick = () => set(cur - 1);
    document.getElementById('inc').onclick = () => set(cur + 1);
    const rs = document.getElementById('rs'); if (rs) rs.onclick = () => set(base);
    document.getElementById('go').onclick = () => { cook = { r, i: 0, f, fill }; unlockAudio(); lockScreen(); renderCook(); };
    view.querySelectorAll('.ing input').forEach(c => c.addEventListener('change', () => { ck[c.dataset.i] = c.checked; c.closest('li').classList.toggle('done', c.checked); }));
  }

  /* ---------- Cooking mode ---------- */
  let cook = null, timers = [], tickId = null, audio = null, wake = null, tid = 0;
  const mins = m => { if (typeof m === 'number') return m; const n = String(m||'').match(/\d+(\.\d+)?/); return n ? +n[0] : 0; };
  const fmt = s => { s = Math.max(0, Math.ceil(s)); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60; return (h ? h + ':' + String(m).padStart(2,'0') : m) + ':' + String(x).padStart(2,'0'); };
  function unlockAudio(){ try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); audio.resume(); } catch(e){} }
  function beep(){
    try { if (!audio) return; const t = audio.currentTime;
      for (let k = 0; k < 3; k++){ const o = audio.createOscillator(), g = audio.createGain(); o.frequency.value = 880; o.connect(g); g.connect(audio.destination);
        g.gain.setValueAtTime(0.0001, t + k*0.4); g.gain.exponentialRampToValueAtTime(0.3, t + k*0.4 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + k*0.4 + 0.3);
        o.start(t + k*0.4); o.stop(t + k*0.4 + 0.32); } } catch(e){}
    try { navigator.vibrate && navigator.vibrate([300,150,300]); } catch(e){}
  }
  async function lockScreen(){ try { if (navigator.wakeLock && !wake) { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => { wake = null; }); } } catch(e){ wake = null; } }
  document.addEventListener('visibilitychange', () => { if (cook && document.visibilityState === 'visible') lockScreen(); });
  function startTimer(label, minutes){
    timers.push({ id: ++tid, label, total: minutes*60, end: Date.now() + minutes*60000, done: false, rang: false });
    if (!tickId) tickId = setInterval(tick, 500);
    renderTray();
  }
  function tick(){
    let changed = false;
    for (const t of timers) if (!t.done && Date.now() >= t.end){ t.done = true; changed = true; if (!t.rang){ t.rang = true; beep(); } }
    if (!timers.length){ clearInterval(tickId); tickId = null; }
    renderTray(changed);
  }
  function renderTray(){
    const tray = document.getElementById('tray'); if (!tray) return;
    tray.innerHTML = timers.map(t => `<div class="tm ${t.done?'done':''}" role="timer"><span>${esc(t.label)}</span><b>${t.done ? 'Done' : fmt((t.end - Date.now())/1000)}</b>${t.done ? '' : `<button type="button" data-add="${t.id}" aria-label="Add a minute">+1</button>`}<button type="button" data-x="${t.id}">${t.done ? 'OK' : 'Stop'}</button></div>`).join('');
    tray.querySelectorAll('[data-x]').forEach(b => b.onclick = () => { timers = timers.filter(t => t.id !== +b.dataset.x); renderTray(); });
    tray.querySelectorAll('[data-add]').forEach(b => b.onclick = () => { const t = timers.find(t => t.id === +b.dataset.add); if (t){ t.end += 60000; renderTray(); } });
  }
  function closeCook(){
    cook = null; const el = document.getElementById('cook'); if (el) el.remove();
    document.body.style.overflow = '';
    try { wake && wake.release(); } catch(e){} wake = null;
  }
  function renderCook(){
    if (!cook) return;
    const { r, i, fill } = cook, steps = r.steps || [], s = steps[i] || {}, m = mins(s.minutes);
    let el = document.getElementById('cook');
    if (!el){ el = document.createElement('div'); el.id = 'cook'; el.setAttribute('role','dialog'); el.setAttribute('aria-label','Cooking mode'); document.body.appendChild(el); document.body.style.overflow = 'hidden'; }
    const running = timers.some(t => t.step === r.id + ':' + i && !t.done);
    el.innerHTML = `<div class="ck-inner">
      <div class="ck-top"><span class="count">${esc(r.title)}</span><button type="button" class="ck-x" id="ckx">Exit</button></div>
      <div class="ck-bar" aria-hidden="true"><i style="width:${(i+1)/steps.length*100}%"></i></div>
      <div class="ck-body">
        <span class="ck-num">Step ${i+1} of ${steps.length}</span>
        <h2>${esc(s.title || '')}</h2>
        <p>${fill(s.text || '')}</p>
        ${m ? `<button type="button" class="ck-timer" id="ckt">${running ? 'Timer running' : `Start ${m}-minute timer`}</button>` : ''}
      </div>
      <div class="tray" id="tray" aria-live="polite"></div>
      <div class="ck-nav">
        <button type="button" id="ckp" ${i === 0 ? 'disabled' : ''}>Back</button>
        <button type="button" class="next" id="ckn">${i === steps.length - 1 ? 'Done' : 'Next'}</button>
      </div></div>`;
    renderTray();
    el.querySelector('#ckx').onclick = closeCook;
    el.querySelector('#ckp').onclick = () => { cook.i--; renderCook(); };
    el.querySelector('#ckn').onclick = () => { if (cook.i < steps.length - 1){ cook.i++; renderCook(); } else closeCook(); };
    const tb = el.querySelector('#ckt');
    if (tb) tb.onclick = () => { if (running) return; unlockAudio(); startTimer(s.title || 'Step ' + (i+1), m); timers[timers.length-1].step = r.id + ':' + i; renderCook(); };
  }

  function route(){
    if (cook) closeCook();
    const h = location.hash.replace(/^#/, '');
    if (h.startsWith('r-')){
      const r = recipes.find(x => x.id === h.slice(2));
      if (r){ renderRecipe(r); window.scrollTo(0,0); return; }
    }
    renderList();
  }
  window.addEventListener('hashchange', route);

  (async () => {
    try {
      const res = await fetch('recipes.json', { cache: 'no-cache' });
      if (!res.ok) throw new Error(res.status);
      recipes = await res.json();
      route();
    } catch (e) {
      view.innerHTML = '<div class="empty"><strong>Recipes didn\'t load</strong>Check your connection and refresh the page.</div>';
    }
  })();
})();
</script>
</body>
</html>
